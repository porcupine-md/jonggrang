services:
  tunnel:
    image: orcinus/jonggrang-tunnel
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jonggrang-tunnel
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TUNNEL_PORT:-2222}:22"
    volumes:
      - ~/ssh/authorized_keys:/root/.ssh/authorized_keys:ro
    networks:
      - jonggrang

networks:
  jonggrang:
    external: true
    name: jonggrang
